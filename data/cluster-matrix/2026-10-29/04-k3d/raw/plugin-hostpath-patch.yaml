spec:
  template:
    spec:
      containers:
      - name: nvidia-device-plugin-ctr
        env:
        - {name: LD_LIBRARY_PATH, value: /usr/lib/wsl/lib}
        securityContext: {privileged: true, allowPrivilegeEscalation: null, capabilities: null}
        volumeMounts:
        - {name: dxg, mountPath: /dev/dxg}
        - {name: wsllib, mountPath: /usr/lib/wsl/lib, readOnly: true}
        - {name: wsldrivers, mountPath: /usr/lib/wsl/drivers, readOnly: true}
      volumes:
      - {name: dxg, hostPath: {path: /dev/dxg, type: CharDevice}}
      - {name: wsllib, hostPath: {path: /usr/lib/wsl/lib, type: Directory}}
      - {name: wsldrivers, hostPath: {path: /usr/lib/wsl/drivers, type: Directory}}
