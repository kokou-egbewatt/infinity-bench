apiVersion: v1
kind: Pod
metadata: {name: probe-cycle1}
spec:
  restartPolicy: Never
  # rationed: asks the scheduler for the GPU
  initContainers:
  - name: bundle
    image: docker.io/library/cm-wsl-bundle:621.01
    imagePullPolicy: IfNotPresent
    command: [sh, -c, "cp -a /bundle/wsl/. /wsl/"]
    volumeMounts: [{name: wsl, mountPath: /wsl}]
  containers:
  - name: probe
    image: docker.io/library/cluster-matrix-probe:01
    imagePullPolicy: IfNotPresent
    command: [sh, /probe/inner.sh]
    env:
    - {name: NVIDIA_VISIBLE_DEVICES, value: all}
    - {name: NVIDIA_DRIVER_CAPABILITIES, value: 'compute,utility'}
    - {name: LD_LIBRARY_PATH, value: /usr/lib/wsl/lib}
    resources: {limits: {nvidia.com/gpu: 1}}
    securityContext: {privileged: true}
    volumeMounts:
    - {name: inner, mountPath: /probe}
    - {name: wsl, mountPath: /usr/lib/wsl, readOnly: true}
    - {name: dxg, mountPath: /dev/dxg}
  volumes:
  - {name: inner, configMap: {name: probe-inner}}
  - {name: wsl, emptyDir: {}}
  - {name: dxg, hostPath: {path: /dev/dxg, type: CharDevice}}
