[project]
name = "infinity-bench-harness"
version = "0.1.0"
description = "Harnesses for infinity-bench. Each runs in a pod on gpu-lab and writes into data/<post>/."
requires-python = ">=3.12"
dependencies = [
  "nvidia-ml-py>=13",
  "pyyaml>=6",
  "typer>=0.15",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
